name: Generate social preview PNG

on:
  push:
    branches: [main]
    paths:
      - "assets/fluxiq-og.svg"
      - ".github/workflows/generate-og-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG as a 1200x630 PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="assets/fluxiq-og.svg",
              write_to="assets/fluxiq-og.png",
              output_width=1200,
              output_height=630
          )
          PY
      - name: Commit PNG if it changed
        run: |
          if git diff --quiet -- assets/fluxiq-og.png && git ls-files --error-unmatch assets/fluxiq-og.png >/dev/null 2>&1; then
            echo "PNG is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fluxiq-og.png
          git commit -m "Add PNG social preview image"
          git push
